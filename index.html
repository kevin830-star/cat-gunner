<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>猫咪保卫战</title>
<meta name="description" content="保卫猫窝，顺便学中文！一款结合 2D 俯视角射击与分级中文学习的网页游戏。">
<meta property="og:title" content="猫咪保卫战">
<meta property="og:description" content="保卫猫窝，顺便学中文！一款结合 2D 俯视角射击与分级中文学习的网页游戏。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<button id="btnPause" class="hudbtn" aria-label="暂停">⏸️</button>
<div id="itemBar"></div>

<!-- 主菜单 -->
<div id="menu" class="overlay show">
  <div class="panel center">
    <h1>猫咪保卫战</h1>
    <p class="sub">保卫猫窝，顺便学中文！</p>
    <div class="howto">
      <p><b>电脑</b>：WASD 移动 · 鼠标瞄准射击 · Q 换枪 · F 冲击波 · R 导弹防御 · 空格 猫薄荷 · P 暂停</p>
      <p><b>手机</b>：左侧拖动移动 · 自动瞄准射击 · 右下角点按钮用道具</p>
      <p>每关开始猫咪生命回满；每 3 关最后出现双倍血量头目，答对中文题可触发 <b>5 秒慢镜头金光觉醒</b>！<br>每打败一个头目解锁一种新道具；每次战败都可参加 <b>10 题中文复活考试</b>（答对 8 题满血复活，不限次数）。</p>
    </div>
    <button class="big" data-action="continue" id="btnContinue" style="display:none">继续游戏</button>
    <div><button class="big" data-action="start" id="btnStart">开始游戏</button></div>
    <div class="toggles">
      <button data-action="toggleGrade" class="tgl" id="tglGrade1"></button>
      <button data-action="togglePinyin" class="tgl" id="tglPinyin1"></button>
    </div>
    <div class="audio-panel unmuted" id="audioPanel1" role="group" aria-label="主音量控制">
      <button data-action="toggleMute" class="tgl audio-btn" id="tglMute1" aria-pressed="false">
        <span class="audio-dot" aria-hidden="true"></span>
        <span class="audio-icon" id="audioIcon1" aria-hidden="true">🔊</span>
        <span class="audio-label" id="audioLabel1">声音已开启</span>
        <span class="audio-badge" id="audioBadge1">未静音</span>
      </button>
      <label class="vol-wrap" for="volSlider1">
        <span class="vol-ttl">音量</span>
        <input type="range" min="0" max="100" step="5" value="80" class="vol-slider" id="volSlider1" aria-label="主音量">
        <span class="vol-pct" id="volPct1">80%</span>
      </label>
      <div class="audio-voice-row">
        <span class="voice-tag" id="voiceTag1">🎙️ 语音：自然明媚女声</span>
        <div class="voice-actions">
          <button data-action="pregenVoice" class="tgl voice-test-btn" id="voicePregen1" type="button">预生成语音</button>
          <button data-action="testVoice" class="tgl voice-test-btn" type="button">试听语音</button>
        </div>
      </div>
    </div>
    <p class="best" id="bestText"></p>
  </div>
</div>

<!-- 暂停 -->
<div id="pause" class="overlay">
  <div class="panel center">
    <h2>暂停</h2>
    <button class="big" data-action="resume">继续游戏</button>
    <div class="toggles">
      <button data-action="toggleGrade" class="tgl" id="tglGrade2"></button>
      <button data-action="togglePinyin" class="tgl" id="tglPinyin2"></button>
    </div>
    <div class="audio-panel unmuted" id="audioPanel2" role="group" aria-label="主音量控制">
      <button data-action="toggleMute" class="tgl audio-btn" id="tglMute2" aria-pressed="false">
        <span class="audio-dot" aria-hidden="true"></span>
        <span class="audio-icon" id="audioIcon2" aria-hidden="true">🔊</span>
        <span class="audio-label" id="audioLabel2">声音已开启</span>
        <span class="audio-badge" id="audioBadge2">未静音</span>
      </button>
      <label class="vol-wrap" for="volSlider2">
        <span class="vol-ttl">音量</span>
        <input type="range" min="0" max="100" step="5" value="80" class="vol-slider" id="volSlider2" aria-label="主音量">
        <span class="vol-pct" id="volPct2">80%</span>
      </label>
      <div class="audio-voice-row">
        <span class="voice-tag" id="voiceTag2">🎙️ 语音：自然明媚女声</span>
        <div class="voice-actions">
          <button data-action="pregenVoice" class="tgl voice-test-btn" id="voicePregen2" type="button">预生成语音</button>
          <button data-action="testVoice" class="tgl voice-test-btn" type="button">试听语音</button>
        </div>
      </div>
    </div>
    <button class="plain" data-action="toMenu">回到主菜单（本关要重打）</button>
  </div>
</div>

<!-- 头目中文题 -->
<div id="quiz" class="overlay">
  <div class="panel center" id="quizBody"></div>
</div>

<!-- 战败复活中文考试（10题答对8题复活） -->
<div id="exam" class="overlay">
  <div class="panel center" id="examBody"></div>
</div>

<!-- 商店 -->
<div id="shop" class="overlay">
  <div class="panel wide" id="shopBody"></div>
</div>

<!-- 汉字小游戏 -->
<div id="mini" class="overlay">
  <div class="panel center" id="miniBody"></div>
</div>

<!-- 游戏结束 -->
<div id="over" class="overlay">
  <div class="panel center" id="overBody"></div>
</div>

<!-- 合成成功 -->
<div id="mergeFx" class="mergefx"></div>

<!-- 击败头目解锁新道具动画 -->
<div id="unlockFx" class="mergefx unlockfx"></div>

<script src="data.js"></script>
<script src="icons.js"></script>
<script src="sound.js"></script>
<script src="bosses.js"></script>
<script src="game.js"></script>
</body>
</html>
