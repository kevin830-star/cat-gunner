<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff9a3c">
<title>学习游戏乐园</title>
<link rel="stylesheet" href="lobby.css">
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <header>
    <h1><span>学习</span><span>游戏</span><span>乐园</span></h1>
    <p>边玩边学 · 中文 · 数学</p>
  </header>

  <div class="cards">
    <a class="gcard cat" href="cat/" data-game="cat">
      <div class="shine"></div>
      <canvas class="scene" data-scene="cat"></canvas>
      <div class="body">
        <h2>猫咪保卫战</h2>
        <div class="tags"><span>🔫 射击</span><span>🏰 守护</span><span>📖 中文</span></div>
        <p>拿起豌豆手枪保卫猫窝！打败头目、答对中文题，觉醒金光变身。</p>
        <div class="save" id="saveCat"></div>
      </div>
      <div class="play">开始玩 ▶</div>
    </a>

    <a class="gcard pets" href="pets/" data-game="pets">
      <div class="shine"></div>
      <span class="new">NEW</span>
      <canvas class="scene" data-scene="pets"></canvas>
      <div class="body">
        <h2>宠物学院大乱斗</h2>
        <div class="tags"><span>🐾 收集</span><span>⚔️ 对战</span><span>📖 中文</span><span>🔢 数学</span></div>
        <p>收集魔法宠物，答题出招！答得越快越容易暴击，挑战草原擂台主。</p>
        <div class="save" id="savePets"></div>
      </div>
      <div class="play">开始玩 ▶</div>
    </a>

    <div class="gcard soon">
      <div class="shine"></div>
      <canvas class="scene" data-scene="soon"></canvas>
      <div class="body">
        <h2>更多游戏制作中…</h2>
        <p>新游戏正在路上，敬请期待！</p>
      </div>
    </div>
  </div>
  <footer>每个游戏的进度都会自动保存在这台设备上</footer>
</main>

<script src="cat/icons.js"></script>
<script src="pets/art.js"></script>
<script src="lobby.js"></script>
</body>
</html>
